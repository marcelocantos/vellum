; Vellum RELEASE view server: the Homebrew-installed vellum (never the
; checkout's ./vellum), alongside the dev build in vellum-view (18742).
; Port 18744: 18743 is bullseye's default MCP port.
;
; Install (@HOME@/@USER@ are rendered, not supervisord %(ENV_*)s: with
; environment= setting HOME, supervisord expands %(ENV_HOME)s to the
; program's HOME, which would misplace the log):
;   mkdir -p ~/.local/state/vellum-release/home ~/.local/state/vellum-release/import-cache ~/.local/var/log
;   sed -e "s|@HOME@|$HOME|g" -e "s|@USER@|$USER|g" supervisor/vellum-view-release.ini \
;     >/opt/homebrew/etc/supervisor.d/vellum-view-release.ini
;   supervisorctl reread && supervisorctl update vellum-view-release
;
; State separation from vellum-view: serve-view has no cache-dir flag, and
; its view/import/KaTeX caches live under os.UserCacheDir()
; (~/Library/Caches/vellum). Cache entries are keyed by source path + mtime
; + size, so the two instances would otherwise serve each other's renders.
; HOME is pointed at a private dir to give the release its own cache tree;
; config (~/.config/vellum) and mmdc's Chromium (~/.cache/puppeteer) are
; deliberately shared via XDG_CONFIG_HOME and PUPPETEER_CACHE_DIR.
; Post-release check: scripts/post-release-check.sh.

[program:vellum-view-release]
command=/opt/homebrew/bin/vellum serve-view --addr 127.0.0.1:18744
directory=@HOME@/.local/state/vellum-release
environment=HOME="@HOME@/.local/state/vellum-release/home",USER="@USER@",XDG_CONFIG_HOME="@HOME@/.config",PUPPETEER_CACHE_DIR="@HOME@/.cache/puppeteer",VELLUM_IMPORT_CACHE="@HOME@/.local/state/vellum-release/import-cache",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:@HOME@/.local/bin:@HOME@/.py/bin:@HOME@/go/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=@HOME@/.local/var/log/vellum-view-release.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
