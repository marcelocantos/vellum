  T20:
    name: An untainted frozen fixture corpus gates the convert matrix, runnable locally via cv gate
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      Achieved 2026-08-07. Oracle: `cv gate` green on macOS (fmt, vet, deps-present, test, skip-census, cli-contract), plus `cv bullseye` (gate + clean tree). Tests 68 -> 126, skips 6 -> 0, media pairs 3/16 -> 16/16.

      Commits: 00f175f (corpus + dep ratchet + .doc fix), c2fb1c6 (clipboard seam + 16-pair matrix), bf42ee2 (README), 34608a7 (styled + media cases), af9b0c8 (declared residue), d16dd93 (cv gate; CI demoted to caller), plus gitignore fixup.

      Corpus: visual/ (textutil, visual formatting only), styled/ (LibreOffice 26.2.5.2, same authored body as visual/ so producer is the only variable), media/ (LibreOffice, embedded picture part). TestCorpus_ProvenanceIsUntainted fails if a manifest ever names pandoc/WeasyPrint/Prince/vellum as producer.

      Two real defects found by the corpus and fixed or pinned: legacy .doc (and any unrecognised extension) was read as Markdown, returning 19 KB of OLE2 binary with a nil error — fixed via checkInferredText; and pandoc 3.10.1's RTF reader hoists an ordered list above the first heading, fixture byte order verified correct, recorded as a known_failure asserting it still fails so an upstream fix surfaces.

      Oracle strength measured, not assumed: eleven mutations injected into the shipped path, all caught — dropped emphasis, truncation, fabricated heading, reversed paragraph order, skipped pasteboard write, emptied clipboard HTML, wrong file_reference path, stripped ATX markers, dropped assets, emptied import, unformatted file. Three earlier drill attempts were self-corrected after being found invalid (mutated code did not compile, or the mutation was a semantic no-op) — the subtest grep had swallowed the build failure.

      Acceptance was rewritten mid-flight with owner consent: the original criteria named GitHub CI installs and a CI-side census, which made the target unattestable without a push. The owner's standard is local green, so the gate moved into ./cvfile and the criteria now name `cv gate`. The ubuntu runner and a Linux container matrix element were dropped — Linux was present because CI finds that path easiest, not because vellum supports it; the clipboard, Finder file references, and the viewer are darwin-only.

      Residue, declared in convert/testdata/corpus/README.md: Mermaid rendering (mmdc needs Chromium; tests fake renderMermaidFn, so routing and format selection are covered but real diagram rendering is not), PDF visual fidelity (existence, non-zero size, and extractable text only), legacy .doc, and real Word / Google Docs output. Also unverified: whether `brew install marcelocantos/tap/cv` and `cv gate` behave on a GitHub macOS runner — a claim about GHA's environment, not vellum's correctness.
    acceptance:
    - testdata/corpus/ holds fixtures produced by implementations independent of pandoc (textutil for visual-only formats; LibreOffice for semantic-style formats), each with a hand-authored manifest declaring recoverable ground truth
    - No fixture was produced by pandoc, WeasyPrint, or vellum itself — provenance is recorded per fixture and enforced by TestCorpus_ProvenanceIsUntainted
    - The oracle asserts imports against the manifest, never against a reference implementation's output; manifests encode per-producer limits (textutil docx has no recoverable headings; LibreOffice's writer8 odt demotes the first H1)
    - The gate is defined in ./cvfile and runnable locally as `cv gate` — fmt, vet, deps-present, test, skip-census, cli-contract — so green is reproducible on the machine in front of you, not only on a CI runner
    - VELLUM_REQUIRE_DEPS=1 converts every external-tool t.Skip into a failure, drilled in both directions
    - cv skip-census fails if any test skips under VELLUM_REQUIRE_DEPS — baseline locked at 0, a ratchet rather than a threshold
    - 'Mutation drill: injected faults are demonstrated to fail the oracle, with the drill recorded'
    - Media-pair coverage rises from 3 of 16 to the full 16, via a clipboard seam mirroring renderMermaidFn
    - 'Media extraction from an office format is covered end to end: the asset lands on disk and the imported Markdown references it'
    - Residue declared explicitly in convert/testdata/corpus/README.md
    context: |-
      Oracle-first, class 2 (reference-comparable), dominant cost term verification-judgment plus a harness term from tools absent in CI.

      The taint problem the owner flagged: fixtures produced by pandoc and read back by pandoc verify round-trip closure, not correctness — they pass even if both directions are symmetrically wrong. Resolution is fixtures from independent implementations plus hand-authored ground-truth manifests, so no reference implementation appears in the oracle.

      STATUS 2026-08-07 — local work complete, one criterion unverified.

      Done and verified locally (commits 00f175f, c2fb1c6, 34608a7, af9b0c8):
