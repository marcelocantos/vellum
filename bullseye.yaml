    - 'Oracle: viewer action tests with injected write seam; manual smoke on test/sample.md task list'
    context: |-
      GFM task lists already render as disabled checkboxes. The viewer knows the source path (data-source) and already exposes destructive-ish loopback actions under /_vellum/ (clipboard, reveal). Toggling a checkbox should flip the corresponding `- [ ]` / `- [x]` line in the original .md.

      Design notes from feasibility review:
      - Index-based source scan (Nth `^\s*[-*+]\s+\[[ xX]\]` match) + matching data-task-index in HTML — no goldmark fork required for v1
      - Consent: sessionStorage = ephemeral (re-prompt next reload); localStorage = permanent
      - Reload after success is the boring-correct v1; optimistic DOM optional
      - Warn about races with external editors; cannot eliminate but consent + loopback scope keeps it honest
