    - style.toc is an optional bool (pointer, default off) on convert.Style, overlayable via config.yaml and MCP/CLI like page_numbers; when on and the document has no hint, the same Contents block is injected at the start of the body
    - A document with both a hint and style.toc gets exactly one Contents block, at the hint location
