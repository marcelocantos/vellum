  T20:
    name: An untainted frozen fixture corpus gates the convert matrix end-to-end in CI
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - testdata/corpus/ holds fixtures produced by implementations independent of pandoc (textutil for visual-only formats; real Word/LibreOffice exports for semantic-style formats), each with a hand-authored manifest declaring recoverable ground truth
    - No fixture in the corpus was produced by pandoc, WeasyPrint, or vellum itself — provenance is recorded per fixture and checked by a test
    - The oracle asserts imports against the manifest, never against a reference implementation's output; manifests encode per-producer limits (e.g. textutil docx has no recoverable heading semantics)
    - CI installs pandoc + weasyprint + poppler on both ubuntu and macos runners
    - VELLUM_REQUIRE_DEPS=1 converts every external-tool t.Skip into a failure; CI sets it, so the 6 currently-skipped tests can never silently stop running
    - A skip-census assertion fails if the number of skipped tests under VELLUM_REQUIRE_DEPS exceeds a locked baseline of 0 — ratchet, not threshold
    - 'Mutation drill: injected faults (break media extraction, drop emphasis, truncate text) are demonstrated to fail the oracle, with the drill recorded'
    - Media-pair coverage rises from 3 of 16 to the full grid for the non-clipboard pairs, via a seam for the clipboard package mirroring renderMermaidFn
    - 'Residue declared explicitly: Mermaid (mmdc needs Chromium) and PDF visual fidelity remain uncovered'
    context: |-
      Oracle-first, class 2 (reference-comparable), dominant cost term verification-judgment plus a harness term from tools absent in CI.

      The taint problem the owner flagged: fixtures produced by pandoc and read back by pandoc verify round-trip closure, not correctness — they pass even if both directions are symmetrically wrong. Resolution is fixtures from independent implementations plus hand-authored ground-truth manifests, so no reference implementation appears in the oracle.

      STATUS 2026-08-07 — local work complete, one criterion unverified.

      Done and verified locally (commits 00f175f, c2fb1c6, 34608a7, af9b0c8):
      - Corpus: visual/ (textutil, visual formatting only), styled/ (LibreOffice 26.2.5.2, semantic styles, same authored body as visual/ so producer is the only variable), media/ (LibreOffice, embedded picture part). TestCorpus_ProvenanceIsUntainted fails if any manifest names pandoc/WeasyPrint/Prince/vellum as producer.
      - Media pairs 3/16 -> 16/16 via four clipboard seams mirroring renderMermaidFn.
      - Ratchet drilled both directions: fails on absent tools with VELLUM_REQUIRE_DEPS=1, skips cleanly without it. Skip census 0 locally.
      - Nine mutations injected into the shipped path, all caught: dropped emphasis, truncation, fabricated heading, reversed paragraph order, skipped pasteboard write, emptied clipboard HTML, wrong file_reference path, stripped ATX markers, dropped assets. Two earlier drill attempts self-corrected after being found invalid (mutated code did not compile; the subtest grep swallowed it).
      - Tests 68 -> 126, skips 6 -> 0.

      Defects found by the corpus, both real:
      - Legacy .doc (and any unrecognised extension) was read as Markdown — 19 KB of OLE2 binary returned with a nil error. Fixed via checkInferredText.
      - pandoc 3.10.1's RTF reader hoists an ordered list above the first heading; fixture byte order verified correct. Recorded as a known_failure asserting it still fails.

      Producer quirks recorded, not papered over: textutil embeds no images in docx at all; LibreOffice's HTML import links rather than embeds (hence the data-URI figure); LibreOffice's writer8 odt export demotes the first H1 while keeping the H2; pandoc emits raw <img> not ![](...) when sizing attributes are present.

      NOT YET VERIFIED — blocks achievement: the CI half. ci.yml now installs pandoc/weasyprint/poppler on both runners, sets VELLUM_REQUIRE_DEPS=1, and adds a skip census locked at 0 — but that workflow has never executed, because the commits are local and the owner has not opened the Ship plane. Per oracle-first rule 15 (an oracle counts for zero until it has run green against the product) this cannot be attested from a local run. Closing T20 requires a push and a green CI run showing the installs work on ubuntu-latest and macos-latest, particularly `apt-get install weasyprint` on ubuntu, which is untested.

      Residue declared in convert/testdata/corpus/README.md: Mermaid (mmdc needs Chromium; tests fake the renderer), PDF visual fidelity, legacy .doc, and real Word/Google Docs output.
    tags:
    - testing
    - oracle
    - ci
    origin: manual
    discovered: 2026-08-07
