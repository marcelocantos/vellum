  T34:
    name: Viewer task-list checkboxes toggle the source Markdown file
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - GFM task-list checkboxes in the view are clickable (not disabled) once the user has consented to source edits
    - First click (or first click after reload when consent is ephemeral) shows a warning that toggling edits the source file on disk; user can approve once per session or permanently (localStorage)
    - POST /_vellum/task-toggle?path=… flips the Nth GFM task marker ([ ] ↔ [x]) in the absolute-path .md file via atomic write; loopback-only; rejects non-markdown paths
    - Serve-time HTML injects data-task-index on each .task-list-item so client and server agree on which line to flip
    - Successful toggle reloads (or re-fetches) the view so stamp/mtime cache invalidation shows the new state
