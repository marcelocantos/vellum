  T19:
    name: Whether pandoc WASM can replace the pandoc CLI dependency is decided on measured evidence
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: 'Won''t fix — solving a non-problem. Dependency count only matters at the needs-nothing / needs-something boundary, and vellum is permanently on the needs-something side: WeasyPrint cannot be eliminated (its 46-package tree carries LGPL obligations plus GPL-3 entries via readline/gettext/libimagequant, incompatible with keeping vellum Apache-2.0 in a bundled work; the Cellar tree is 468 MB against a 12 MB binary), and mmdc pulls Node + Chromium regardless. Removing pandoc alone takes 5 external deps to 4, which changes nothing for a user who runs `brew install` — Homebrew already solves dependency management, and `depends_on` is mere aggregation with near-zero compliance burden, unlike bundling. The measured latency case is also weak: pandoc CLI costs ~31 ms/invocation (20 md->html runs in 0.62 s, 2026-08-07), noise against WeasyPrint PDF rendering. Same reasoning retires the adjacent KaTeX-via-goja idea: it wouldn''t remove Node either. Revisit only if the PDF engine is replaced by something with a shallow tree AND Mermaid stops needing a browser — i.e. if zero deps becomes reachable, at which point this becomes one step of a whole-tree plan rather than an isolated win.'
    acceptance:
    - A pandoc.wasm artifact (wasm32-wasi, pandoc >= 3.9) is obtained or built, with version and size recorded (raw, post-wasm-opt, gzipped)
    - A throwaway Go harness embeds it via wazero (pure Go, no cgo) and successfully calls the `convert` entry point
    - 'Round-trip parity: markdown -> html and markdown -> docx via WASM match `pandoc -f markdown -t X` on the same input, byte-identical or with differences enumerated and judged benign'
    - 'The filesystem question is settled: whether WASI preopens permit --extract-media (the DOCX/RTF/PDF media extraction importer/ depends on) is demonstrated working or documented as blocked, with the probe recorded'
    - Binary size delta measured against today's 12.5 MB installed vellum
    - Latency measured (cold module init + per-conversion) against the CLI baseline of ~31 ms per invocation (20 md->html runs in 0.62 s, measured 2026-08-07)
    - A written adopt / reject / defer recommendation citing those numbers lands in the attestation
    - If the recommendation is adopt, a follow-on target is raised for the migration itself — this target ships no production change
    context: |-
      Spike-then-decide. pandoc is a hard external dependency today (formula depends_on + caveats + lazy exec in importer/). Pandoc gained official wasm32-wasi support in 3.9, exposing C-callable `convert` and `query` entry points (these power https://pandoc.org/app entirely client-side). wazero could host that from Go with no cgo and no external binary, letting vellum drop pandoc from PATH requirements.

      Investigated 2026-08-07 while scoping output-format expansion. Motivating findings: (1) pandoc has no C shared library — Homebrew ships only bin/pandoc — so linking is a non-starter; (2) `pandoc server` mode DOES work in the installed 3.10.1 binary and handles binary writers over HTTP, but is sandboxed with no filesystem access (an embed-resources probe left an on-disk image path unresolved) and no PDF writer, so it cannot serve the import path; (3) WASM is therefore the only route to eliminating the dependency. Unknowns are the WASI filesystem story and artifact size — hence a spike, not a migration.

      Related but out of scope: expanding output formats from 4 to ~12 via pandoc writers (76 available), which works fine over plain exec and should not wait on this.
    tags:
    - spike
    - dependencies
    - wasm
    origin: manual
    discovered: 2026-08-07
