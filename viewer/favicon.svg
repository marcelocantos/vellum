<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vellum">
  <!-- Two strokes of translucent sheet crossing at the foot of a V. The
       colours are solid (the overlap is drawn through a mask), so the mark
       looks the same on a dark tab bar as on a light one. -->
  <defs>
    <mask id="vellum-mark-left" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <path d="M7.5 8 16 24.5" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <g fill="none" stroke-width="6.5" stroke-linecap="round">
    <path d="M7.5 8 16 24.5M24.5 8 16 24.5" stroke="#d99f86"/>
    <path d="M24.5 8 16 24.5" stroke="#cb7a58" mask="url(#vellum-mark-left)"/>
  </g>
</svg>
