  <path d="M112 84 H152 M240 84 H280 M368 84 H408" stroke="#656d76" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#656d76">Click to open the figure viewer</text>
