  </defs>
  <rect width="520" height="160" rx="12" fill="url(#bg)" stroke="#d1d9e0"/>
  <text x="260" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2328">vellum pipeline</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1f2328">
    <rect x="24" y="56" width="88" height="56" rx="10" fill="url(#node)" stroke="#d1d9e0"/>
    <text x="68" y="80" text-anchor="middle" font-weight="600">Markdown</text>
    <text x="68" y="98" text-anchor="middle" fill="#656d76">source</text>

    <rect x="152" y="56" width="88" height="56" rx="10" fill="url(#node)" stroke="#d1d9e0"/>
